name = "personal-radar-cron"
main = "src/worker.ts"
compatibility_date = "2026-06-12"
compatibility_flags = ["nodejs_compat"]

[browser]
binding = "BROWSER"

[[d1_databases]]
binding = "DB"
database_name = "personal-radar"
database_id = "cd24444b-000a-4435-9c7b-ee3c659a41cf"

[triggers]
crons = [
  "0 */6 * * *",
  "30 0 * * *",
  "30 4,8,12 * * *",
  "15 * * * *"
]

[vars]
BANDSINTOWN_APP_ID = "personal-radar"
ICA_CHECK_ENABLED = "false"
ICA_TARGET_BEFORE = "2026-07-01"
# Digests run in this cron worker and need the owner account to scope the feed.
ADMIN_EMAILS = "tofu.hike@gmail.com"
